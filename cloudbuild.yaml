# ==============================================================================
# Google Cloud Build Pipeline for StudioSonar Multi-Agent Architecture
# Deploys to Cloud Run with Zero-Secret Service Account & Vertex AI Grounding
# ==============================================================================

steps:
  # Step 1: Build container image with Docker layer caching
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/studiosonar-taskmaster:$_TAG'
      - '-t'
      - 'gcr.io/$PROJECT_ID/studiosonar-taskmaster:latest'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/studiosonar-taskmaster:latest'
      - '.'
    id: 'build-image'

  # Step 2: Push images to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/studiosonar-taskmaster:$_TAG']
    id: 'push-tag-image'

  # Step 3: Deploy Service to Google Cloud Run with Dedicated Service Account
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'studiosonar-taskmaster'
      - '--image=gcr.io/$PROJECT_ID/studiosonar-taskmaster:$_TAG'
      - '--region=us-central1'
      - '--platform=managed'
      - '--service-account=studio-sonar-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCP_LOCATION=us-central1,BIGQUERY_DATASET=studiosonar_analytics,EXECUTION_MODE=live,GEMINI_MODEL=gemini-3.8-flash,USE_VERTEX_SEARCH_GROUNDING=true,GOOGLE_SEARCH_ENABLED=true,CLICKHOUSE_HOST=sfzvgvl2p7.us-central1.gcp.clickhouse.cloud,CLICKHOUSE_PORT=8443,CLICKHOUSE_USER=default,CLICKHOUSE_PASSWORD=ZoUQbd24Iv~~J,CLICKHOUSE_DATABASE=default,CLICKHOUSE_SECURE=true,TRIGGER_ACTIVE_WINDOW_ENABLED=true,TRIGGER_START_HOUR=8,TRIGGER_END_HOUR=18,TRIGGER_TIMEZONE=Asia/Ho_Chi_Minh,YOUTUBE_DATA_API_KEY=AIzaSyAV5KupWHw65Y-EMtuEcgm7DFkszYyBOx4'
    id: 'deploy-cloud-run-service'

substitutions:
  _TAG: 'latest'

options:
  logging: CLOUD_LOGGING_ONLY
